<div class="page-split">
  <div class="panel-form">
    <div class="form-inner">

      <div class="icono-estado">
        <mat-icon class="icono-reloj">hourglass_top</mat-icon>
      </div>

      <h1 class="titulo">Solicitud en revisión</h1>
      <p class="subtitulo">
        El equipo de CareMe está verificando tu perfil y documentación.<br>
        Te notificaremos cuando tu cuenta sea activada.
      </p>

      <div class="pasos">
        <div class="paso paso-ok">
          <mat-icon>check_circle</mat-icon>
          <span>Registro completado</span>
        </div>
        <div class="paso paso-activo">
          <mat-icon>pending</mat-icon>
          <span>Revisión por el equipo CareMe</span>
        </div>
        <div class="paso paso-pendiente">
          <mat-icon>radio_button_unchecked</mat-icon>
          <span>Cuenta activada</span>
        </div>
      </div>

      <a routerLink="/login">
        <button mat-raised-button color="primary" class="btn-login">
          <mat-icon>login</mat-icon> Ir al inicio de sesión
        </button>
      </a>

    </div>
  </div>

  <div class="panel-imagen">
    <img src="https://webdesignfyp.com/wp-content/uploads/2026/06/happy-nurse-take-care-elderly-man-wheelchair-garden-nursing-home-scaled.jpg"
         alt="CareMe" class="imagen-lateral" />
  </div>
</div>
