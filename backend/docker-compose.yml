services:
  db:
    image: postgres:16-alpine
    container_name: careme-db
    environment:
      POSTGRES_DB: careme_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - careme_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: careme-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/careme_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IP_FRONTEND: http://${PUBLIC_HOST}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: careme-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  careme_db_data:
